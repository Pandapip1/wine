name: nt-probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/probes/**'
      - '.github/workflows/nt-probe.yml'
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: FSCTL_SET_ZERO_DATA semantics
        shell: pwsh
        run: .github/probes/zero-data.ps1
      - name: FSCTL_SET_ZERO_DATA edge cases
        if: always()
        shell: pwsh
        run: .github/probes/zero-data-edges.ps1
      - name: FSCTL_SET_ZERO_DATA input buffer length
        if: always()
        shell: pwsh
        run: .github/probes/zero-data-buflen.ps1
      - name: VHD / cluster-size capability
        if: always()
        shell: pwsh
        run: .github/probes/vhd-capability.ps1
