name: nt-probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/probes/**'
      - '.github/workflows/nt-probe.yml'
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: FSCTL_SET_ZERO_DATA semantics
        shell: pwsh
        run: .github/probes/zero-data.ps1
